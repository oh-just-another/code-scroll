<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 40 40">
  <!-- Code Scroll: a page of code with the minimap as a sidebar on its right edge. -->
  <defs>
    <clipPath id="tile">
      <rect x="2" y="2" width="36" height="36" rx="7"/>
    </clipPath>
  </defs>
  <rect x="2" y="2" width="36" height="36" rx="7" fill="#FFFFFF"/>
  <rect x="2.5" y="2.5" width="35" height="35" rx="6.5" fill="none" stroke="#111111" stroke-opacity="0.12" stroke-width="1"/>
  <g clip-path="url(#tile)">
    <rect x="24" y="2" width="14" height="36" fill="#4E8CFF"/>
    <rect x="25" y="8" width="8" height="1" fill="#111111" fill-opacity="0.7"/>
    <rect x="25" y="10" width="6" height="1" fill="#111111"/>
    <rect x="25" y="13" width="6" height="1" fill="#111111" fill-opacity="0.7"/>
    <rect x="25" y="15" width="5" height="1" fill="#111111" fill-opacity="0.7"/>
    <rect x="25" y="17" width="8" height="1" fill="#111111"/>
    <rect x="25" y="20" width="6" height="1" fill="#111111" fill-opacity="0.7"/>
    <rect x="25" y="22" width="6" height="1" fill="#111111" fill-opacity="0.7"/>
    <rect x="25" y="24" width="5" height="1" fill="#111111"/>
    <rect x="25" y="27" width="8" height="1" fill="#111111" fill-opacity="0.7"/>
  </g>
  <rect x="4" y="7" width="17" height="2.4" rx="1.2" fill="#111111" fill-opacity="0.5"/>
  <rect x="4" y="11" width="12" height="2.4" rx="1.2" fill="#4E8CFF"/>
  <rect x="4" y="15" width="10" height="2.4" rx="1.2" fill="#111111" fill-opacity="0.5"/>
  <rect x="4" y="19" width="15" height="2.4" rx="1.2" fill="#111111" fill-opacity="0.5"/>
  <rect x="4" y="23" width="9" height="2.4" rx="1.2" fill="#4E8CFF"/>
  <rect x="4" y="27" width="10" height="2.4" rx="1.2" fill="#111111" fill-opacity="0.5"/>
  <rect x="4" y="31" width="16" height="2" rx="1" fill="#111111" fill-opacity="0.5"/>
</svg>
